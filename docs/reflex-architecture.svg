<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F3EC"/>
      <stop offset="1" stop-color="#EAF1ED"/>
    </linearGradient>
    <linearGradient id="core" x1="480" y1="330" x2="1150" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183B3A"/>
      <stop offset="1" stop-color="#255E56"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#183B3A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" stroke="#6B827D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #183B3A; letter-spacing: -1px; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #5C6F6A; }
      .section { font: 700 13px Inter, Arial, sans-serif; fill: #78908A; letter-spacing: 2px; }
      .node-title { font: 700 19px Inter, Arial, sans-serif; fill: #183B3A; }
      .node-copy { font: 400 14px Inter, Arial, sans-serif; fill: #5C6F6A; }
      .core-title { font: 700 22px Inter, Arial, sans-serif; fill: #FFFFFF; }
      .core-copy { font: 400 14px Inter, Arial, sans-serif; fill: #C5D8D0; }
      .label { font: 600 12px Inter, Arial, sans-serif; fill: #52706A; }
      .chip { font: 600 12px Inter, Arial, sans-serif; fill: #255E56; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <circle cx="1460" cy="110" r="180" fill="#D8E7DF" opacity="0.55"/>
  <circle cx="90" cy="910" r="210" fill="#E5DCCB" opacity="0.45"/>

  <text x="100" y="92" class="section">REFLEX / SYSTEM MAP</text>
  <text x="100" y="145" class="title">Delivery control architecture</text>
  <text x="100" y="180" class="subtitle">A modular foundation for accountable delivery operations in low-connectivity environments.</text>
  <rect x="1290" y="83" width="210" height="42" rx="21" fill="#255E56"/>
  <text x="1395" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">VERSION 1 / VALIDATE</text>

  <text x="100" y="256" class="section">PEOPLE &amp; CHANNELS</text>
  <text x="510" y="256" class="section">PRODUCT SURFACE</text>
  <text x="910" y="256" class="section">CORE SERVICES</text>
  <text x="1260" y="256" class="section">CONNECTED SYSTEMS</text>

  <g filter="url(#shadow)">
    <rect x="100" y="300" width="300" height="110" rx="16" fill="#FFFFFF"/>
    <circle cx="142" cy="345" r="22" fill="#E5DCCB"/>
    <path d="M132 350C132 342 137 337 142 337C147 337 152 342 152 350M136 330C136 326 139 323 142 323C145 323 148 326 148 330" stroke="#8E6B3E" stroke-width="2" stroke-linecap="round"/>
    <text x="180" y="342" class="node-title">Retailer staff</text>
    <text x="180" y="366" class="node-copy">Create and monitor requests</text>
    <rect x="180" y="380" width="115" height="20" rx="10" fill="#F1EADD"/>
    <text x="237" y="394" text-anchor="middle" class="chip">WEB / MOBILE</text>

    <rect x="100" y="455" width="300" height="110" rx="16" fill="#FFFFFF"/>
    <circle cx="142" cy="500" r="22" fill="#D8E7DF"/>
    <path d="M132 505H152M134 499H150M138 493H146" stroke="#255E56" stroke-width="2" stroke-linecap="round"/>
    <text x="180" y="497" class="node-title">Dispatcher</text>
    <text x="180" y="521" class="node-copy">Assign riders and resolve exceptions</text>
    <rect x="180" y="535" width="97" height="20" rx="10" fill="#EAF3EE"/>
    <text x="228" y="549" text-anchor="middle" class="chip">DESKTOP</text>

    <rect x="100" y="610" width="300" height="110" rx="16" fill="#FFFFFF"/>
    <circle cx="142" cy="655" r="22" fill="#F2D8D0"/>
    <path d="M130 660L137 653L145 660L153 653M135 646L142 641L149 646" stroke="#9A503E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="652" class="node-title">Rider</text>
    <text x="180" y="676" class="node-copy">Scan, update, and capture proof</text>
    <rect x="180" y="690" width="126" height="20" rx="10" fill="#FAEAE5"/>
    <text x="243" y="704" text-anchor="middle" class="chip">PWA / OFFLINE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="510" y="300" width="300" height="420" rx="20" fill="#FFFFFF" stroke="#D7E4DD"/>
    <rect x="535" y="325" width="250" height="55" rx="12" fill="#183B3A"/>
    <text x="560" y="358" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Reflex PWA</text>
    <text x="560" y="372" font-family="Inter, Arial, sans-serif" font-size="11" fill="#C5D8D0">ONE SHARED DELIVERY RECORD</text>
    <text x="550" y="425" class="node-title">Role-based surfaces</text>
    <text x="550" y="450" class="node-copy">Retailer / Dispatcher / Rider</text>
    <path d="M550 480H770" stroke="#D7E4DD"/>
    <text x="550" y="515" class="node-title">Local action queue</text>
    <text x="550" y="540" class="node-copy">Supports work during weak connectivity</text>
    <rect x="550" y="570" width="104" height="28" rx="14" fill="#EAF3EE"/>
    <text x="602" y="588" text-anchor="middle" class="chip">RETRY EVENTS</text>
    <rect x="665" y="570" width="105" height="28" rx="14" fill="#F1EADD"/>
    <text x="717" y="588" text-anchor="middle" class="chip">SYNC STATUS</text>
    <text x="550" y="646" class="node-title">Proof capture</text>
    <text x="550" y="671" class="node-copy">Scan, recipient, location, photo</text>
</g>

  <g filter="url(#shadow)">
    <rect x="910" y="300" width="300" height="420" rx="20" fill="url(#core)"/>
    <text x="950" y="355" class="core-title">TypeScript API</text>
    <text x="950" y="380" class="core-copy">THE WORKFLOW AUTHORITY</text>
    <path d="M950 410H1170" stroke="#5D8A7E"/>
    <text x="950" y="450" class="core-title" font-size="17">Delivery service</text>
    <text x="950" y="477" class="core-copy">Requests, assignments, status</text>
    <text x="950" y="530" class="core-title" font-size="17">Transition guard</text>
    <text x="950" y="557" class="core-copy">Requested → Assigned → Picked Up</text>
    <text x="950" y="579" class="core-copy">→ Delivered / Failed</text>
    <text x="950" y="632" class="core-title" font-size="17">Event identity</text>
    <text x="950" y="659" class="core-copy">Versions prevent stale writes</text>
    <rect x="950" y="680" width="145" height="26" rx="13" fill="#3D7567"/>
    <text x="1022" y="697" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">AUDITABLE STATE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1260" y="300" width="240" height="110" rx="16" fill="#FFFFFF"/>
    <text x="1290" y="342" class="node-title">PostgreSQL</text>
    <text x="1290" y="368" class="node-copy">Relational source of truth</text>
    <rect x="1290" y="382" width="114" height="20" rx="10" fill="#EAF3EE"/>
    <text x="1347" y="396" text-anchor="middle" class="chip">HISTORY</text>

    <rect x="1260" y="455" width="240" height="110" rx="16" fill="#FFFFFF"/>
    <text x="1290" y="497" class="node-title">Object storage</text>
    <text x="1290" y="523" class="node-copy">Delivery photos and evidence</text>
    <rect x="1290" y="535" width="82" height="20" rx="10" fill="#FAEAE5"/>
    <text x="1331" y="549" text-anchor="middle" class="chip">PROOF</text>

    <rect x="1260" y="610" width="240" height="110" rx="16" fill="#FFFFFF"/>
    <text x="1290" y="652" class="node-title">External services</text>
    <text x="1290" y="678" class="node-copy">SMS, maps, live event channel</text>
    <rect x="1290" y="690" width="74" height="20" rx="10" fill="#F1EADD"/>
    <text x="1327" y="704" text-anchor="middle" class="chip">ADAPTERS</text>
  </g>

  <path d="M400 355H510" stroke="#6B827D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 510H510" stroke="#6B827D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 665H510" stroke="#6B827D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M810 510H910" stroke="#6B827D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1210 355H1260" stroke="#6B827D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1210 510H1260" stroke="#6B827D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1210 665H1260" stroke="#6B827D" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="835" width="1400" height="80" rx="16" fill="#183B3A"/>
  <text x="135" y="870" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#A8C8BC">OPERATING PRINCIPLE</text>
  <text x="135" y="896" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">The API validates every transition; the history preserves every decision.</text>
  <text x="1460" y="884" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#C5D8D0">Offline actions retry with unique event IDs.</text>
</svg>